plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.syu-likelion'
version = '0.0.1-SNAPSHOT'

// Security fixes tracked in the 2026-09-16 runtime dependency audit.
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.5'
ext['jackson-2-bom.version'] = '2.21.5'
ext['netty.version'] = '4.2.17.Final'
ext['httpclient5.version'] = '5.6.3'
ext['httpcore5.version'] = '5.4.3'
ext['log4j2.version'] = '2.25.5'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.46.11')
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.webjars.npm:jsqr:1.4.0'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets {
	databaseTools {
		java.srcDir 'tools/database'
	}
}

dependencies {
	databaseToolsRuntimeOnly 'com.mysql:mysql-connector-j'
}

tasks.register('exportDatabaseSchema', Test) {
	description = 'Export the current Hibernate schema without connecting to MySQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching 'org.syu_likelion.Festa_2026.config.DatabaseSchemaTests' }
	outputs.upToDateWhen { false }
	doLast {
		copy {
			from 'build/reports/database/schema-compare.sql'
			into 'docs'
			rename { 'database-schema-compare.sql' }
		}
	}
}

tasks.register('checkTextCapacityMigration', JavaExec) {
	dependsOn databaseToolsClasses
	classpath = sourceSets.databaseTools.runtimeClasspath
	mainClass = 'TextCapacityMigrationChecks'
}

tasks.register('databaseTextCapacity', JavaExec) {
	description = 'Inspect text capacity in configured MySQL; use -PapplyTextCapacity to apply widening.'
	dependsOn exportDatabaseSchema, checkTextCapacityMigration
	classpath = sourceSets.databaseTools.runtimeClasspath
	mainClass = 'TextCapacityMigration'
	if (project.hasProperty('applyTextCapacity')) args '--apply'
}

tasks.named('test') {
	useJUnitPlatform()
}
