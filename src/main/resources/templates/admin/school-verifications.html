<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 인증 승인 | 천보축전 관리자</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-page">
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">
<header class="admin-header">
    <a class="admin-logo" th:href="@{/admin}"><img class="brand-logo" th:src="@{/images/Logo.webp}" alt="천보축전 로고"></a>
    <div class="admin-account">
        <div><strong th:text="${adminName}">최고 관리자</strong><span th:text="${adminRole}">SUPER_ADMIN</span></div>
        <form method="post" th:action="@{/admin/logout}"><button class="button button-ghost button-small" type="submit">로그아웃</button></form>
    </div>
</header>

<main class="admin-main">
    <nav class="breadcrumb" aria-label="현재 위치"><a th:href="@{/admin}">관리자 홈</a><span>/</span><strong>학생 인증 승인</strong></nav>
    <section class="management-toolbar">
        <div><p class="eyebrow">IDENTITY REVIEW</p><h1>학생 인증 미승인 요청</h1><p>동아리 SSO 회원정보와 학교 학적정보를 비교해 처리합니다.</p></div>
        <span class="feature-count" th:text="|${verificationRequests.size()}건 대기|">0건 대기</span>
    </section>
    <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>

    <section class="empty-panel" th:if="${verificationRequests.empty}">
        <strong>미승인 요청이 없습니다.</strong><p>이름 또는 학번이 일치하지 않는 인증 요청이 들어오면 여기에 표시됩니다.</p>
    </section>

    <section class="panel review-panel" th:unless="${verificationRequests.empty}">
        <div class="table-wrap">
            <table class="review-table">
                <thead><tr><th>회원</th><th>동아리 SSO</th><th>학교 학적정보</th><th>요청 시각</th><th>처리</th></tr></thead>
                <tbody><tr th:each="item : ${verificationRequests}">
                    <td><strong th:text="${item.currentName}">회원 이름</strong><small th:text="${item.userUuid}">UUID</small></td>
                    <td><span th:text="${item.currentStudentNo}">기존 학번</span><small th:text="${item.currentDepartment ?: '-'}">기존 학과</small></td>
                    <td><strong th:text="${item.schoolName}">학교 이름</strong><span th:text="${item.schoolStudentNo}">학교 학번</span><small th:text="${item.schoolDepartment}">학교 학과</small></td>
                    <td th:text="${#temporals.format(item.requestedAt, 'yyyy-MM-dd HH:mm')}">2026-08-30 20:00</td>
                    <td><div class="verification-actions">
                        <form method="post" th:action="@{/admin/school-verifications/{id}/approve(id=${item.id})}" onsubmit="return confirm('학교 학적정보를 확인하고 학생 인증을 승인할까요?');"><button class="button button-primary button-small" type="submit">승인</button></form>
                        <form method="post" th:action="@{/admin/school-verifications/{id}/delete(id=${item.id})}" onsubmit="return confirm('이 인증 요청을 삭제할까요?');"><button class="button button-danger button-small" type="submit">삭제</button></form>
                    </div></td>
                </tr></tbody>
            </table>
        </div>
    </section>
</main>
<div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
</body>
</html>
