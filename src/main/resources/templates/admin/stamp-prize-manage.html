<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>스탬프 상품 지급 | 천보축전 관리자</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin/assets/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/admin/assets/css/admin.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/css/admin-console.css}">
    <script defer th:src="@{/admin/assets/webjars/jsqr/1.4.0/dist/jsQR.js}"></script>
    <script defer th:src="@{/admin/assets/js/admin-qr.js}"></script>
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout"><aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace"><main id="admin-content" tabindex="-1" class="admin-main qr-page">
    <nav class="breadcrumb" aria-label="현재 위치"><a th:href="@{/admin}">관리자 홈</a><span>/</span><a th:href="@{/admin/stamps}">스탬프 지급 관리</a><span>/</span><strong>상품 지급</strong></nav>
    <section class="page-heading"><div><h1>스탬프 상품 지급</h1><p>서로 다른 부스 스탬프 6개 이상을 모은 사용자에게 상품을 한 번만 지급합니다.</p></div></section>
    <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>
    <nav class="camera-actions" aria-label="상품 지급 메뉴"><a class="button button-primary" th:href="@{/admin/stamps/prizes}">상품 지급</a><a class="button button-secondary" th:href="@{/admin/stamps/prizes/manage}">상품 지급 이력</a></nav>
    <section class="panel">
        <h2 th:text="|상품 지급 완료 ${issuedCount}명|">상품 지급 이력</h2>
        <p>철회한 기록도 보존합니다. 재지급은 사용자의 스탬프판을 다시 확인한 후 처리합니다.</p>
        <div class="stamp-table-wrap"><table class="stamp-table"><thead><tr><th>수령자</th><th>학번</th><th>상태</th><th>지급 당시 스탬프</th><th>최근 지급 관리자</th><th>최근 지급 시각</th><th>관리</th></tr></thead>
        <tbody><tr th:each="item : ${records.content}"><td th:text="${item.name}"></td><td th:text="${item.studentNo ?: '-'}"></td><td th:text="${item.issued ? '지급 완료' : '지급 철회'}"></td><td th:text="${item.stampCount}"></td><td th:text="${item.grantedByName}"></td><td th:text="${#temporals.format(item.grantedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm:ss')}"></td><td><a class="button button-secondary button-small" th:href="@{/admin/stamps/prizes/records/{id}(id=${item.id})}">이력·철회</a></td></tr></tbody></table></div>
        <p th:if="${records.empty}">상품 지급 기록이 없습니다.</p>
        <nav class="camera-actions" th:if="${records.totalPages > 1}" aria-label="지급 이력 페이지"><a class="button button-secondary" th:if="${records.hasPrevious()}" th:href="@{/admin/stamps/prizes/manage(page=${records.number - 1})}">이전</a><span th:text="|${records.number + 1} / ${records.totalPages} 페이지|"></span><a class="button button-secondary" th:if="${records.hasNext()}" th:href="@{/admin/stamps/prizes/manage(page=${records.number + 1})}">다음</a></nav>
    </section>
</main><div th:replace="~{admin/fragments/footer :: footer(true)}"></div></div></div>
</body></html>
