<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/stamp-prizes/layout :: page('상품 지급 이력', 'history', ~{::content})}">
<body><div th:fragment="content" class="prize-stack">
    <section class="panel prize-stack">
        <h2 th:text="|상품 지급 완료 ${issuedCount}명|">상품 지급 이력</h2>
        <p>철회한 기록도 보존합니다. 재지급은 사용자의 스탬프판을 다시 확인한 후 처리합니다.</p>
        <div class="prize-table-wrap"><table class="prize-table"><thead><tr><th>수령자</th><th>학번</th><th>상태</th><th>지급 당시 스탬프</th><th>최근 지급 관리자</th><th>최근 지급 시각</th><th>관리</th></tr></thead>
        <tbody><tr th:each="item : ${records.content}"><td th:text="${item.name}"></td><td th:text="${item.studentNo ?: '-'}"></td><td th:text="${item.issued ? '지급 완료' : '지급 철회'}"></td><td th:text="${item.stampCount}"></td><td th:text="${item.grantedByName}"></td><td th:text="${#temporals.format(item.grantedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm:ss')}"></td><td><a class="button button-secondary button-small" th:href="@{/admin/stamps/prizes/records/{id}(id=${item.id})}">이력·철회</a></td></tr></tbody></table></div>
        <p th:if="${records.empty}">상품 지급 기록이 없습니다.</p>
        <nav class="prize-actions prize-pagination" th:if="${records.totalPages > 1}" aria-label="지급 이력 페이지"><a class="button button-secondary" th:if="${records.hasPrevious()}" th:href="@{/admin/stamps/prizes/manage(page=${records.number - 1})}">이전</a><span th:text="|${records.number + 1} / ${records.totalPages} 페이지|"></span><a class="button button-secondary" th:if="${records.hasNext()}" th:href="@{/admin/stamps/prizes/manage(page=${records.number + 1})}">다음</a></nav>
    </section>
</div></body></html>
