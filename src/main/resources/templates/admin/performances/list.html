<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공연팀 관리 | 천보축전 관리자페이지</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">
<header th:replace="~{admin/fragments/header :: header}"></header>

<main id="admin-content" tabindex="-1" class="admin-main">
    <nav class="breadcrumb" aria-label="현재 위치">
        <a th:href="@{/admin}">관리자 홈</a><span>/</span><strong>공연팀 관리</strong>
    </nav>

    <section class="management-toolbar">
        <div>
            <p class="eyebrow">STAGE LINEUP</p>
            <h1>공연팀 관리</h1>
            <p>연예인·동아리·개인 공연팀을 필요한 만큼 계속 추가할 수 있습니다.</p>
        </div>
        <a class="button button-primary" th:href="@{/admin/performances/new}">공연팀 추가</a>
    </section>

    <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>

    <section class="empty-panel" th:if="${#lists.isEmpty(performances)}">
        <strong>등록된 공연팀이 없습니다.</strong>
        <p>첫 번째 공연팀을 등록해 무대 라인업을 구성해 주세요.</p>
        <a class="button button-primary" th:href="@{/admin/performances/new}">첫 공연팀 등록</a>
    </section>

    <section class="performance-list" th:unless="${#lists.isEmpty(performances)}">
        <article class="performance-admin-card" th:each="performance : ${performances}">
            <div class="performance-card-top">
                <div>
                    <span class="category-chip" th:text="${performance.categoryLabel}">연예인</span>
                    <span class="publish-chip" th:classappend="${performance.published} ? ' is-public' : ' is-scheduled'"
                          th:text="${performance.published} ? '공개 중' : '공개 예정'">공개 예정</span>
                </div>
                <span class="media-count" th:text="|이미지 ${#lists.size(performance.images)} · 동영상 ${#lists.size(performance.videos)}|">미디어</span>
            </div>
            <h2 th:text="${performance.teamName}">팀 이름</h2>
            <p class="member-summary" th:text="${#strings.listJoin(performance.memberNames, ', ')}">구성원</p>
            <dl class="performance-meta">
                <div><dt>공연 시작</dt><dd th:text="${#temporals.format(performance.startsAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')} + ' KST'">2026-08-10 19:00 KST</dd></div>
                <div><dt>공연 종료</dt><dd th:text="${#temporals.format(performance.endsAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')} + ' KST'">2026-08-10 20:00 KST</dd></div>
                <div><dt>공개 일시</dt><dd th:text="${#temporals.format(performance.publishedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')} + ' KST'">2026-08-01 09:00 KST</dd></div>
            </dl>
            <div class="performance-card-actions">
                <a class="button button-secondary" th:href="@{/admin/performances/{id}/edit(id=${performance.id})}">수정</a>
                <form method="post" th:action="@{/admin/performances/{id}/delete(id=${performance.id})}"
                      onsubmit="return confirm('이 공연팀과 업로드 파일을 삭제할까요?');">
                    <button class="button button-danger" type="submit">삭제</button>
                </form>
            </div>
        </article>
    </section>
</main>
<div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
</body>
</html>
