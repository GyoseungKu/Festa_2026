<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 | SYU FESTA 2026</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="login-body">
<main class="login-shell">
    <section class="login-brand" aria-label="축제 관리자 페이지 소개">
        <div class="brand-identity brand-identity-login">
            <img class="brand-logo" th:src="@{/images/Logo.webp}" src="/images/Logo.webp" alt="천보축전 로고">
            <div class="brand-title">
                <span class="brand-kicker">삼육대학교 개교 120주년</span>
                <strong class="brand-name">천보축전 관리자페이지</strong>
            </div>
        </div>
        <h1>축제 운영을 위한<br>하나의 컨트롤 센터</h1>
        <p class="brand-copy">현장 운영 기능과 사용자 확인 업무를 안전하게 관리합니다.</p>
        <div class="brand-badge">SSO 보안 로그인</div>
    </section>

    <section class="login-card">
        <div class="card-heading">
            <p class="eyebrow">ADMIN CONSOLE</p>
            <h2>관리자 로그인</h2>
            <p>축제 운영 권한이 부여된 SSO 계정으로 로그인하세요.</p>
        </div>

        <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>

        <form class="login-form" method="post" th:action="@{/admin/login}">
            <label for="loginId">로그인 아이디</label>
            <input id="loginId" name="loginId" type="text" autocomplete="username"
                   maxlength="100" required autofocus th:value="${loginId}">

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   maxlength="128" required>

            <button class="button button-primary button-full" type="submit">관리자 페이지 입장</button>
        </form>

        <p class="login-help">권한이 없다면 축제 최고 관리자에게 문의하세요.</p>
    </section>
</main>
<div th:replace="~{admin/fragments/footer :: footer(false)}"></div>
</body>
</html>
