<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>투표 관리 | 천보축전 관리자페이지</title><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/admin-console.css}"></head>
<body class="admin-page">
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">
<header class="admin-header"><a class="admin-logo" th:href="@{/admin}"><img class="brand-logo" th:src="@{/images/Logo.webp}" alt="천보축전 로고"></a>
    <div class="admin-account"><div><strong th:text="${adminName}">관리자</strong><span th:text="${adminRole}">ADMIN</span></div>
        <form method="post" th:action="@{/admin/logout}"><button class="button button-ghost button-small">로그아웃</button></form></div></header>
<main class="admin-main"><nav class="breadcrumb"><a th:href="@{/admin}">관리자 홈</a><span>/</span><strong>투표 관리</strong></nav>
    <section class="management-toolbar"><div><p class="eyebrow">POLL &amp; RESPONSE FORM</p><h1>투표 관리</h1>
        <p>객관식·주관식 질문으로 응답 폼을 만들고 실시간 현황을 확인합니다.</p></div>
        <a class="button button-primary" th:href="@{/admin/polls/new}">새 투표 만들기</a></section>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <section class="empty-panel" th:if="${#lists.isEmpty(polls)}"><strong>등록된 투표가 없습니다.</strong>
        <p>첫 번째 투표 또는 응답 폼을 만들어 주세요.</p><a class="button button-primary" th:href="@{/admin/polls/new}">투표 만들기</a></section>
    <section class="poll-admin-list" th:unless="${#lists.isEmpty(polls)}">
        <article class="poll-admin-card" th:each="poll : ${polls}">
            <div class="poll-card-top"><div><span class="category-chip" th:text="${poll.anonymous ? '익명' : '기명'}">익명</span>
                <span class="publish-chip" th:classappend="${poll.state.name() == 'OPEN'} ? ' is-public' : ' is-scheduled'" th:text="${poll.state.name() == 'OPEN' ? '진행 중' : (poll.state.name() == 'UPCOMING' ? '진행 예정' : '종료')}">진행 중</span></div>
                <span class="media-count" th:text="${poll.allowMultipleSubmissions ? '복수 참여' : '1회 참여'}">1회 참여</span></div>
            <h2 th:text="${poll.title}">투표 제목</h2><p th:text="${poll.description}">설명</p>
            <dl class="performance-meta"><div><dt>공개</dt><dd th:text="${#temporals.format(poll.publishedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')}">공개</dd></div>
                <div><dt>진행</dt><dd th:text="|${#temporals.format(poll.startsAt.atZone(seoulZone), 'MM-dd HH:mm')} ~ ${#temporals.format(poll.endsAt.atZone(seoulZone), 'MM-dd HH:mm')}|">진행</dd></div>
                <div><dt>결과 공개</dt><dd th:text="${poll.resultPublishedAt == null ? '관리자 전용' : #temporals.format(poll.resultPublishedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')}">관리자 전용</dd></div></dl>
            <div class="performance-card-actions"><a class="button button-primary" th:href="@{/admin/polls/{id}(id=${poll.id})}">현황</a>
                <a class="button button-secondary" th:href="@{/admin/polls/{id}/edit(id=${poll.id})}">수정</a></div>
        </article>
    </section>
</main><div th:replace="~{admin/fragments/footer :: footer(true)}"></div></div></div>
</body></html>
