<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>투표 현황 | 천보축전 관리자페이지</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><header class="admin-header"><a class="admin-logo" th:href="@{/admin}"><img class="brand-logo" th:src="@{/images/Logo.webp}" alt="천보축전 로고"></a><div class="admin-account"><div><strong th:text="${adminName}">관리자</strong><span th:text="${adminRole}">ADMIN</span></div><form method="post" th:action="@{/admin/logout}"><button class="button button-ghost button-small">로그아웃</button></form></div></header>
<main class="admin-main"><nav class="breadcrumb"><a th:href="@{/admin}">관리자 홈</a><span>/</span><a th:href="@{/admin/polls}">투표 관리</a><span>/</span><strong>현황</strong></nav>
<div class="alert alert-success" th:if="${message}" th:text="${message}"></div><div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
<section class="management-toolbar"><div><p class="eyebrow">LIVE POLL STATUS</p><h1 th:text="${detail.poll.title}">투표</h1><p><span th:text="${detail.poll.anonymous ? '익명' : '기명'}">익명</span> · <strong th:text="|총 ${detail.submissionCount}건 제출|">0건</strong> · <span id="refresh-count">15초 후 자동 갱신</span></p></div><div class="poll-detail-actions"><a class="button button-secondary" th:href="@{/admin/polls/{id}/edit(id=${detail.poll.id})}">수정</a><button class="button button-secondary" type="button" onclick="location.reload()">새로고침</button></div></section>
<section class="poll-result-grid"><article class="form-section" th:each="question : ${detail.results.questions}"><div class="poll-result-head"><div><span th:text="${question.type}">유형</span><h2 th:text="${question.text}">질문</h2></div><strong th:text="|${question.answeredCount}명 응답|">0명</strong></div>
<div class="poll-bars" th:unless="${#lists.isEmpty(question.options)}"><div class="poll-bar-row" th:each="option : ${question.options}"><div><span th:text="${option.text}">선택지</span><strong th:text="|${option.count}표 · ${option.percentage}%|">0표</strong></div><div class="poll-bar"><i th:style="|'width:' + ${option.percentage} + '%'|"></i></div></div></div>
<div class="text-response-list" th:unless="${#lists.isEmpty(question.textAnswers)}"><div th:each="answer : ${question.textAnswers}"><p th:text="${answer.text}">응답</p><time th:text="${#temporals.format(answer.submittedAt.atZone(seoulZone), 'MM-dd HH:mm:ss')}">시간</time></div></div></article></section>
<section class="form-section"><div class="form-section-heading"><span>↳</span><div><h2>제출 내역</h2><p th:if="${detail.poll.anonymous and !superAdmin}">익명 투표이므로 ADMIN에게 참여자 신원을 표시하지 않습니다.</p><p th:if="${detail.poll.anonymous and superAdmin}">SUPER_ADMIN 권한으로 익명 투표의 원본 참여자를 확인하고 있습니다.</p><p th:text="|${detail.size}건 단위 · 전체 ${detail.totalElements}건|">페이지 정보</p></div></div>
<div class="poll-submission-list"><details th:each="submission,index : ${detail.submissions}"><summary><strong th:text="${submission.userName == null ? '익명 응답' : submission.userName}">응답</strong><span th:if="${submission.studentNo}" th:text="${submission.studentNo}">학번</span><time th:text="${#temporals.format(submission.submittedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm:ss')}">시간</time></summary><dl><div th:each="answer : ${submission.answers}"><dt th:text="${answer.questionText}">질문</dt><dd th:text="${answer.text != null ? answer.text : #strings.listJoin(answer.optionTexts, ', ')}">응답</dd></div></dl></details></div>
<nav class="poll-pagination" th:if="${detail.totalPages > 1}"><a class="button button-secondary button-small" th:if="${detail.page > 0}" th:href="@{/admin/polls/{id}(id=${detail.poll.id},page=${detail.page - 1},size=${detail.size})}">이전</a><span th:text="|${detail.page + 1} / ${detail.totalPages}|">1 / 1</span><a class="button button-secondary button-small" th:if="${detail.page + 1 < detail.totalPages}" th:href="@{/admin/polls/{id}(id=${detail.poll.id},page=${detail.page + 1},size=${detail.size})}">다음</a></nav></section>
<div class="form-actions" th:if="${detail.poll.state.name() != 'ENDED'}"><form method="post" th:action="@{/admin/polls/{id}/close(id=${detail.poll.id})}" onsubmit="return confirm('이 투표를 지금 즉시 종료할까요? 다시 열 수 없습니다.');"><button class="button button-danger">즉시 종료</button></form></div>
<div class="form-actions"><form method="post" th:action="@{/admin/polls/{id}/delete(id=${detail.poll.id})}" onsubmit="return confirm('투표를 삭제할까요?');"><input th:if="${superAdmin and detail.submissionCount > 0}" type="hidden" name="force" value="true"><button class="button button-danger" th:text="${detail.submissionCount > 0 ? (superAdmin ? '강제 삭제' : '응답이 있어 삭제 불가') : '삭제'}" th:disabled="${detail.submissionCount > 0 and !superAdmin}">삭제</button></form></div>
</main><div th:replace="~{admin/fragments/footer :: footer(true)}"></div><script>let left=15;setInterval(()=>{left--;const el=document.querySelector('#refresh-count');if(el)el.textContent=`${left}초 후 자동 갱신`;if(left<=0)location.reload();},1000);</script></body></html>
