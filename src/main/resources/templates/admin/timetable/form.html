<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>타임테이블 등록·수정 | 천보축전 관리자페이지</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">

<main id="admin-content" tabindex="-1" class="admin-main">
    <nav class="breadcrumb"><a th:href="@{/admin/timetable}">타임테이블 관리</a><span>/</span><strong th:text="${editing ? '수정' : '등록'}">등록</strong></nav>
    <section class="page-heading"><h1 th:text="${editing ? '일정 수정' : '새 일정 등록'}">새 일정 등록</h1></section>
    <p>한국 시간(KST) 기준입니다. 공개 시각 전에도 일정 시간은 표시되고 일정명은 TBA로 표시됩니다.</p>
    <div class="alert alert-error" role="alert" th:if="${error}" th:text="${error}"></div>
    <form class="performance-form" method="post" th:object="${form}"
          th:action="${editing} ? @{/admin/timetable/{id}(id=${schedule.id})} : @{/admin/timetable}">
        <section class="form-section"><div class="form-grid">
            <label class="field-group field-full"><span>일정명</span><input type="text" th:field="*{title}" maxlength="150" placeholder="개회식, 공연팀 이름, 폐회식" required></label>
            <label class="field-group field-full"><span>공연팀 연결 (선택)</span>
                <select th:field="*{performanceId}"><option value="">연결 없음</option>
                    <option th:each="team : ${performances}" th:value="${team.id}" th:text="${team.teamName}"
                            th:attr="data-title=${team.teamName},
                                     data-starts-at=${#temporals.format(team.startsAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm').replace(' ', 'T')},
                                     data-ends-at=${#temporals.format(team.endsAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm').replace(' ', 'T')},
                                     data-published-at=${#temporals.format(team.publishedAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm').replace(' ', 'T')}"></option>
                </select>
                <small>팀을 선택하면 일정명·시작·종료·공개 일시가 자동으로 채워집니다. 모든 값은 수정할 수 있으며, 다른 팀을 선택하면 해당 팀 정보로 다시 채워집니다.</small>
            </label>
            <label class="field-group"><span>시작 일시</span><input type="datetime-local" th:field="*{startsAt}" required></label>
            <label class="field-group"><span>종료 일시</span><input type="datetime-local" th:field="*{endsAt}" required></label>
            <label class="field-group"><span>일정명 공개 일시</span><input type="datetime-local" th:field="*{publishedAt}" required></label>
        </div></section>
        <div class="form-actions"><a class="button button-secondary" th:href="@{/admin/timetable}">취소</a><button class="button button-primary" type="submit">저장</button></div>
    </form>
</main>
<div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
<script th:src="@{/js/admin-timetable.js}" defer></script>
</body>
</html>
