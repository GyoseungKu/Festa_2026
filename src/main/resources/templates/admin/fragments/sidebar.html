<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<aside class="admin-sidebar" th:fragment="sidebar"
 th:with="features=${@adminFeatures.available(adminNavigationRoles, adminRole)}">
 <a class="admin-brand" th:href="@{/admin}" aria-label="Make a Wish 관리자 홈"><img class="sidebar-logo" th:src="@{/admin/assets/images/festa.png}" src="/admin/assets/images/festa.png" width="579" height="419" alt="Make a Wish"><span>2026 천보축전 · ADMIN CONSOLE</span></a>
 <div class="sidebar-account">
  <div class="sidebar-account-identity"><strong th:text="${adminName}">관리자</strong><span th:text="${adminRole}">ADMIN</span></div>
  <form method="post" th:action="@{/admin/logout}">
   <button class="button button-ghost button-small" type="submit">로그아웃</button>
  </form>
 </div>
 <nav class="admin-nav" aria-label="관리자 메뉴">
 <a th:href="@{/admin}" th:attr="aria-current=${adminCurrentPath == '/admin' ? 'page' : null}">대시보드</a>
 <a th:each="feature : ${features}" th:href="@{${feature.path}}"
    th:attr="aria-current=${adminCurrentPath == feature.path or #strings.startsWith(adminCurrentPath, feature.path + '/') ? 'page' : null}"
    th:text="${feature.navigationTitle}"></a>
 </nav><p class="admin-sidebar-note">삼육대학교 개교 120주년<br>행사 운영 관리 시스템</p>
</aside></body></html>
