<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<header class="admin-header" th:fragment="header">
    <a class="admin-logo" th:href="@{/admin}" aria-label="Make a Wish 관리자 홈">
        <img class="brand-logo" th:src="@{/images/festa.png}" src="/images/festa.png"
             width="579" height="419" alt="Make a Wish">
        <span class="brand-title"><span class="brand-kicker">2026 천보축전</span><strong class="brand-name">운영 관리</strong></span>
    </a>
    <div class="admin-account">
        <div><strong th:text="${adminName}">관리자</strong><span th:text="${adminRole}">ADMIN</span></div>
        <form method="post" th:action="@{/admin/logout}">
            <button class="button button-ghost button-small" type="submit">로그아웃</button>
        </form>
    </div>
</header>
</body></html>
