<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생일축하 쪽지 상세 | 천보축전 관리자</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><link rel="stylesheet" th:href="@{/css/admin.css}">
<link rel="stylesheet" th:href="@{/css/admin-console.css}">
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">
<header th:replace="~{admin/fragments/header :: header}"></header>
<main id="admin-content" tabindex="-1" class="admin-main">
    <nav class="breadcrumb" aria-label="현재 위치"><a th:href="@{/admin}">관리자 홈</a><span>/</span><a th:href="@{/admin/birthday-messages}">생일축하 쪽지</a><span>/</span><strong>상세</strong></nav>
    <section class="management-toolbar"><div><p class="eyebrow">MESSAGE DETAIL</p><h1>생일축하 쪽지 상세</h1><p>작성자 정보는 현재 관리자 권한 범위에 맞춰 표시됩니다.</p></div></section>
    <section class="birthday-detail-panel">
        <div class="birthday-note-content" th:text="${item.content}">생일 축하해!</div>
        <div class="birthday-card-flags"><span>♥ <b th:text="${item.heartCount}">0</b></span>
            <time th:text="${#temporals.format(item.createdAt.atZone(seoulZone), 'yyyy-MM-dd HH:mm')} + ' KST'">작성일</time></div>
        <h2>작성자 정보</h2>
        <dl class="birthday-user-grid">
            <div th:if="${item.author.name != null}"><dt>이름</dt><dd th:text="${item.author.name}"></dd></div>
            <div th:if="${item.author.studentNo != null}"><dt>학번</dt><dd th:text="${item.author.studentNo}"></dd></div>
            <div th:if="${item.author.department != null}"><dt>학과</dt><dd th:text="${item.author.department}"></dd></div>
            <div th:if="${item.author.grade != null}"><dt>학년</dt><dd th:text="${item.author.grade}"></dd></div>
            <div th:if="${item.author.phone != null}"><dt>전화번호</dt><dd th:text="${item.author.phone}"></dd></div>
            <div th:if="${item.author.email != null}"><dt>이메일</dt><dd th:text="${item.author.email}"></dd></div>
            <div th:if="${item.author.userUuid != null}"><dt>UUID</dt><dd class="mono" th:text="${item.author.userUuid}"></dd></div>
            <div th:if="${item.author.loginId != null}"><dt>로그인 ID</dt><dd th:text="${item.author.loginId}"></dd></div>
            <div th:if="${item.author.ssoRole != null}"><dt>SSO 역할</dt><dd th:text="${item.author.ssoRole}"></dd></div>
            <div th:if="${item.author.status != null}"><dt>계정 상태</dt><dd th:text="${item.author.status}"></dd></div>
            <div th:if="${item.author.enrollment != null}"><dt>재학 상태</dt><dd th:text="${item.author.enrollment}"></dd></div>
            <div th:if="${item.author.birthDate != null}"><dt>생년월일</dt><dd th:text="${item.author.birthDate}"></dd></div>
            <div th:if="${item.author.createdAt != null}"><dt>계정 생성</dt><dd th:text="${item.author.createdAt}"></dd></div>
            <div th:if="${item.author.updatedAt != null}"><dt>계정 수정</dt><dd th:text="${item.author.updatedAt}"></dd></div>
            <div th:if="${item.author.festivalRoles != null}"><dt>축제 권한</dt><dd th:text="${item.author.festivalRoles}"></dd></div>
        </dl>
        <div class="performance-card-actions birthday-detail-actions">
            <a class="button button-secondary" th:href="@{/admin/birthday-messages/{id}/hearts(id=${item.id})}" th:text="|하트 사용자 ${item.heartCount}명|">하트 사용자</a>
            <form method="post" th:action="@{/admin/birthday-messages/{id}/delete(id=${item.id})}" onsubmit="return confirm('이 쪽지를 삭제할까요? 작성자는 삭제 후 다시 작성할 수 있습니다.');">
                <button class="button button-danger" type="submit">삭제</button></form>
        </div>
    </section>
</main><div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
</body></html>
