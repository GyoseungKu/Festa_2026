<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 홈 | SYU FESTA 2026</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header class="admin-header">
    <a class="admin-logo" th:href="@{/admin}">
        <img class="brand-logo" th:src="@{/images/Logo.webp}" src="/images/Logo.webp" alt="천보축전 로고">
    </a>
    <div class="admin-account">
        <div>
            <strong th:text="${adminName}">관리자</strong>
            <span th:text="${adminRole}">ADMIN</span>
        </div>
        <form method="post" th:action="@{/admin/logout}">
            <button class="button button-ghost button-small" type="submit">로그아웃</button>
        </form>
    </div>
</header>

<main class="admin-main">
    <section class="hero-panel">
        <div>
            <p class="eyebrow">삼육대학교 개교 120주년</p>
            <h1>천보축전 관리자페이지</h1>
            <p>필요한 관리 기능을 선택해 주세요.</p>
        </div>
        <div class="hero-orb" aria-hidden="true"><span>2026</span></div>
    </section>

    <section class="feature-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">AVAILABLE TOOLS</p>
                <h2>관리 기능</h2>
            </div>
            <span class="feature-count" th:text="${canManagePerformances ? '2개 기능 사용 가능' : '1개 기능 사용 가능'}">1개 기능 사용 가능</span>
        </div>

        <div class="feature-grid">
            <a class="feature-card" th:href="@{/admin/qr}">
                <span class="feature-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img"><path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm4 0h3v3h-3v-3Zm-4 4h3v3h-3v-3Zm4 0h3v3h-3v-3Z"/></svg>
                </span>
                <div>
                    <span class="feature-status">운영 중</span>
                    <h3>QR 사용자 조회</h3>
                    <p>사용자의 동적 QR을 스캔하고 내 권한 범위의 사용자 정보를 확인합니다.</p>
                </div>
                <span class="feature-arrow" aria-hidden="true">→</span>
            </a>

            <a class="feature-card" th:if="${canManagePerformances}" th:href="@{/admin/performances}">
                <span class="feature-icon feature-icon-stage" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img"><path d="M4 4h16v10H4V4Zm2 2v6h12V6H6Zm-3 9h18v2H3v-2Zm4 3h10l2 3H5l2-3Z"/></svg>
                </span>
                <div>
                    <span class="feature-status">운영 중</span>
                    <h3>공연팀 관리</h3>
                    <p>연예인·동아리·개인 공연팀과 공개 일정, 미디어를 등록하고 관리합니다.</p>
                </div>
                <span class="feature-arrow" aria-hidden="true">→</span>
            </a>

            <div class="feature-card feature-card-disabled" aria-disabled="true" th:if="${!canManagePerformances}">
                <span class="feature-icon feature-icon-muted" aria-hidden="true">+</span>
                <div>
                    <span class="feature-status feature-status-muted">준비 중</span>
                    <h3>새로운 운영 기능</h3>
                    <p>축제 운영 기능이 추가되면 이곳에서 바로 사용할 수 있습니다.</p>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
