<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 홈 | SYU FESTA 2026</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin/assets/images/favicon.svg}" href="/admin/assets/images/favicon.svg">
    <link rel="stylesheet" th:href="@{/admin/assets/css/admin.css}">
<link rel="stylesheet" th:href="@{/admin/assets/css/admin-console.css}">
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">

<main id="admin-content" tabindex="-1" class="admin-main" th:with="features=${@adminFeatures.available(adminNavigationRoles, adminRole)}">
    <section class="hero-panel">
        <div>
            <p class="eyebrow">삼육대학교 개교 120주년</p>
            <h1>천보축전 관리자페이지</h1>
            <p>필요한 관리 기능을 선택해 주세요.</p>
        </div>
        <div class="hero-orb" aria-hidden="true"><span>2026</span></div>
    </section>

    <section class="feature-section">
        <div class="section-heading">
            <div>
                <p class="eyebrow">AVAILABLE TOOLS</p>
                <h2>관리 기능</h2>
            </div>
            <span class="feature-count" th:text="${#lists.size(features) + '개 기능 사용 가능'}">1개 기능 사용 가능</span>
        </div>

        <div class="feature-grid">
            <a class="feature-card" th:each="feature : ${features}" th:href="@{${feature.path}}">
                <span th:class="${feature.iconClass}" aria-hidden="true">
                    <svg th:if="${!#strings.isEmpty(feature.iconPath)}" viewBox="0 0 24 24" role="img"><path th:attr="d=${feature.iconPath}"/></svg>
                    <span th:unless="${!#strings.isEmpty(feature.iconPath)}" th:text="${feature.iconSymbol}"></span>
                </span>
                <div>
                    <span class="feature-status" th:text="${feature.path == '/admin/school-verifications' ? feature.status + ' · ' + schoolVerificationRequestCount + '건 대기' : feature.status}"></span>
                    <h3 th:text="${feature.title}"></h3>
                    <p th:text="${feature.description}"></p>
                </div>
                <span class="feature-arrow" aria-hidden="true">→</span>
            </a>

            <div class="feature-card feature-card-disabled" aria-disabled="true" th:if="${!canManagePerformances}">
                <span class="feature-icon feature-icon-muted" aria-hidden="true">+</span>
                <div>
                    <span class="feature-status feature-status-muted">준비 중</span>
                    <h3>새로운 운영 기능</h3>
                    <p>축제 운영 기능이 추가되면 이곳에서 바로 사용할 수 있습니다.</p>
                </div>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
</body>
</html>
