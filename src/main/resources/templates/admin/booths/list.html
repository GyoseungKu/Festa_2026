<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>부스 관리 | 천보축전 관리자페이지</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/admin/assets/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/admin/assets/css/admin.css}">
<link rel="stylesheet" th:href="@{/admin/assets/css/admin-console.css}">
</head>
<body class="admin-page">
<a class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div class="admin-layout">
<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
<div class="admin-workspace">
<main id="admin-content" tabindex="-1" class="admin-main">
    <nav class="breadcrumb" aria-label="현재 위치"><a th:href="@{/admin}">관리자 홈</a><span>/</span><strong>부스 관리</strong></nav>
    <section class="management-toolbar"><div><p class="eyebrow">FESTIVAL MAP</p><h1>부스 관리</h1><p>부스 좌표, 운영 정보, 담당자와 미디어를 관리합니다.</p></div>
        <a class="button button-primary" th:href="@{/admin/booths/new}">부스 추가</a></section>
    <div class="alert alert-success" role="status" th:if="${message}" th:text="${message}"></div>
    <section class="empty-panel" th:if="${#lists.isEmpty(booths)}"><strong>등록된 부스가 없습니다.</strong><p>첫 부스를 등록해 축제 지도를 구성해 주세요.</p></section>
    <section class="performance-list" th:unless="${#lists.isEmpty(booths)}">
        <article class="performance-admin-card" th:each="item : ${booths}" th:with="booth=${item.booth}">
            <div class="performance-card-top"><span class="category-chip" th:text="${booth.category.label}">카테고리</span><span class="category-chip" th:text="${booth.stampEnabled ? '스탬프 지급 부스' : '스탬프 미지급 부스'}">부스 유형</span><span class="media-count" th:text="|미디어 ${#lists.size(booth.media)}개|">미디어</span></div>
            <h2 th:text="${booth.name}">부스명</h2><p class="member-summary" th:text="${booth.operator}">운영 주체</p>
            <dl class="performance-meta">
                <div><dt>좌표</dt><dd th:text="|${booth.latitude}, ${booth.longitude}|">좌표</dd></div>
                <div><dt>운영시간</dt><dd th:text="|${booth.opensAt} ~ ${booth.closesAt}|">10:00 ~ 18:00</dd></div>
                <div><dt>담당자</dt><dd th:text="|${#lists.size(item.managerUuids)}명|">0명</dd></div>
            </dl>
            <div class="performance-card-actions"><a class="button button-secondary" th:href="@{/admin/booths/{id}/edit(id=${booth.id})}">수정</a>
                <form method="post" th:action="@{/admin/booths/{id}/delete(id=${booth.id})}" onsubmit="return confirm('이 부스와 찜, 업로드 파일을 삭제할까요?');">
                    <button class="button button-danger" type="submit">삭제</button></form></div>
        </article>
    </section>
</main>
<div th:replace="~{admin/fragments/footer :: footer(true)}"></div>
</div></div>
</body>
</html>
