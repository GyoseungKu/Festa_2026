spring.application.name=Festa_2026
spring.config.import=optional:classpath:env.properties

server.port=${SERVER_PORT:8888}

#상: 개발용 DB 원격 접속 경로
#하: 배포용 서버 로컬 DB 경로
#spring.datasource.url=${DB_URL:jdbc:mysql://129.225.200.218:3306/Likelion_SYU_festa2026?allowPublicKeyRetrieval=true&connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Likelion_SYU_festa2026?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}

spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=${DB_TIME_ZONE:Asia/Seoul}

r2.endpoint=${R2_ENDPOINT:https://2f59f81f48ee0c3340032aa91d361f58.r2.cloudflarestorage.com}
r2.region=${R2_REGION:auto}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET:likelion-main}
r2.base-url=${R2_BASE_URL:https://cdn.syu-likelion.org}
r2.performance-prefix=${R2_PERFORMANCE_PREFIX:festa2026_performance}
r2.lost-item-prefix=${R2_LOST_ITEM_PREFIX:festa2026_lost_items}
r2.booth-prefix=${R2_BOOTH_PREFIX:festa2026_booths}
r2.poll-prefix=${R2_POLL_PREFIX:festa2026_polls}
r2.image-max-size=${R2_IMAGE_MAX_SIZE:10MB}
r2.video-max-size=${R2_VIDEO_MAX_SIZE:200MB}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:650MB}
server.servlet.session.timeout=${SESSION_TIMEOUT:20m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.from=no-reply@syu-likelion.org

spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

festival.welcome-email.enabled=${WELCOME_EMAIL_ENABLED:true}
festival.welcome-email.from=${WELCOME_EMAIL_FROM:${MAIL_USERNAME}}
festival.welcome-email.from-name=${WELCOME_EMAIL_FROM_NAME:Likelion SYU}
festival.welcome-email.subject=${WELCOME_EMAIL_SUBJECT:[Likelion SYU] 삼육대학교 개교 120주년 천보축전 홈페이지 가입을 환영합니다.}
festival.welcome-email.site-url=${WELCOME_EMAIL_SITE_URL:https://festa.syu-likelion.org}

sso.base-url=${SSO_BASE_URL:https://sso.syu-likelion.org}
sso.client-id=${SSO_CLIENT_ID}
sso.client-secret=${SSO_CLIENT_SECRET}
sso.connect-timeout=${SSO_CONNECT_TIMEOUT:3s}
sso.read-timeout=${SSO_READ_TIMEOUT:5s}
sso.refresh-cookie-name=${SSO_REFRESH_COOKIE_NAME:refreshToken}
sso.service-scopes=${SSO_SERVICE_SCOPES:user.email.read user.profile.read}

auth.refresh-cookie-name=${FESTIVAL_REFRESH_COOKIE_NAME:festivalRefreshToken}
auth.refresh-cookie-secure=${FESTIVAL_REFRESH_COOKIE_SECURE:true}
auth.refresh-cookie-same-site=${FESTIVAL_REFRESH_COOKIE_SAME_SITE:Strict}
auth.refresh-cookie-max-age=${FESTIVAL_REFRESH_COOKIE_MAX_AGE:7d}

admin.access-cookie-name=${ADMIN_ACCESS_COOKIE_NAME:festivalAdminAccess}
admin.refresh-cookie-name=${ADMIN_REFRESH_COOKIE_NAME:festivalAdminRefresh}
admin.cookie-secure=${ADMIN_COOKIE_SECURE:true}
admin.cookie-same-site=${ADMIN_COOKIE_SAME_SITE:Strict}
admin.refresh-cookie-max-age=${ADMIN_REFRESH_COOKIE_MAX_AGE:7d}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,https://festa.syu-likelion.org}

# High-traffic API request logging: request threads never wait for log INSERTs.
api-request-log.enabled=${API_REQUEST_LOG_ENABLED:true}
api-request-log.queue-capacity=${API_REQUEST_LOG_QUEUE_CAPACITY:10000}
api-request-log.batch-size=${API_REQUEST_LOG_BATCH_SIZE:250}
api-request-log.flush-interval=${API_REQUEST_LOG_FLUSH_INTERVAL:250ms}
api-request-log.retention=${API_REQUEST_LOG_RETENTION:60d}
api-request-log.cleanup-interval=${API_REQUEST_LOG_CLEANUP_INTERVAL:5m}
api-request-log.cleanup-batch-size=${API_REQUEST_LOG_CLEANUP_BATCH_SIZE:5000}
api-request-log.cleanup-max-batches=${API_REQUEST_LOG_CLEANUP_MAX_BATCHES:4}
# All writes/admin/errors/slow calls are stored. Only successful API GETs are sampled.
api-request-log.successful-read-sample-rate=${API_REQUEST_LOG_SUCCESSFUL_READ_SAMPLE_RATE:0.25}
api-request-log.slow-request-threshold=${API_REQUEST_LOG_SLOW_REQUEST_THRESHOLD:1s}
# Enable only when the reverse proxy removes client-supplied Forwarded/X-Forwarded-For headers.
api-request-log.trust-forwarded-headers=${API_REQUEST_LOG_TRUST_FORWARDED_HEADERS:false}

# React page/action analytics. Events are queued and written with JDBC batches.
frontend-analytics.enabled=${FRONTEND_ANALYTICS_ENABLED:true}
frontend-analytics.queue-capacity=${FRONTEND_ANALYTICS_QUEUE_CAPACITY:20000}
frontend-analytics.batch-size=${FRONTEND_ANALYTICS_BATCH_SIZE:500}
frontend-analytics.flush-interval=${FRONTEND_ANALYTICS_FLUSH_INTERVAL:500ms}
frontend-analytics.retention=${FRONTEND_ANALYTICS_RETENTION:60d}
frontend-analytics.cleanup-interval=${FRONTEND_ANALYTICS_CLEANUP_INTERVAL:5m}
frontend-analytics.cleanup-batch-size=${FRONTEND_ANALYTICS_CLEANUP_BATCH_SIZE:5000}
frontend-analytics.cleanup-max-batches=${FRONTEND_ANALYTICS_CLEANUP_MAX_BATCHES:4}
frontend-analytics.maximum-past-age=${FRONTEND_ANALYTICS_MAXIMUM_PAST_AGE:24h}
frontend-analytics.maximum-future-skew=${FRONTEND_ANALYTICS_MAXIMUM_FUTURE_SKEW:5m}
frontend-analytics.maximum-duration=${FRONTEND_ANALYTICS_MAXIMUM_DURATION:12h}
frontend-analytics.max-events-per-minute=${FRONTEND_ANALYTICS_MAX_EVENTS_PER_MINUTE:120}
frontend-analytics.max-tracked-sessions=${FRONTEND_ANALYTICS_MAX_TRACKED_SESSIONS:100000}
frontend-analytics.session-tracking-ttl=${FRONTEND_ANALYTICS_SESSION_TRACKING_TTL:10m}

# Runtime monitoring. Actuator is isolated from the public HTTP port.
management.server.port=${MANAGEMENT_SERVER_PORT:9091}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Anonymous presence is held only in this JVM and expires automatically.
monitoring.presence-ttl=${MONITORING_PRESENCE_TTL:150s}
monitoring.presence-cleanup-interval-ms=${MONITORING_PRESENCE_CLEANUP_INTERVAL_MS:30000}
monitoring.presence-max-sessions=${MONITORING_PRESENCE_MAX_SESSIONS:100000}
# MariaDB status is probed once per interval and served from memory to every dashboard viewer.
monitoring.db-probe-interval-ms=${MONITORING_DB_PROBE_INTERVAL_MS:15000}
monitoring.db-query-timeout-seconds=${MONITORING_DB_QUERY_TIMEOUT_SECONDS:2}
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:2}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

qr.token-ttl=${QR_TOKEN_TTL:60s}
qr.cleanup-interval-ms=${QR_CLEANUP_INTERVAL_MS:60000}

# TEMPORARY: remove this block with TemporaryAuthUiController after the production frontend is ready.
temporary-auth-ui.enabled=${TEMPORARY_AUTH_UI_ENABLED:true}

# School academic-information SSO (permanent backend API; independent from the temporary frontend).
school-sso.enabled=${SCHOOL_SSO_ENABLED:true}
school-sso.client-id=${SYU_SSO_CLIENT_ID:festa-2026}
school-sso.client-secret=${SYU_SSO_CLIENT_SECRET}
school-sso.authorize-url=${SYU_SSO_AUTHORIZE_URL:https://www.syu.ac.kr/festa-sso/authorize}
school-sso.token-url=${SYU_SSO_TOKEN_URL:https://www.syu.ac.kr/wp-json/syu-festa/v1/token}
school-sso.jwks-url=${SYU_SSO_JWKS_URL:https://www.syu.ac.kr/wp-json/syu-sso/v1/jwks}
school-sso.callback-url=${SYU_SSO_CALLBACK_URL:https://festa.syu-likelion.org/auth/sso/callback}
school-sso.issuer=${SYU_SSO_ISSUER:https://www.syu.ac.kr}
school-sso.audience=${SYU_SSO_AUDIENCE:festa-2026}
school-sso.return-url=${SYU_SSO_RETURN_URL:/temporary-auth}
school-sso.connect-timeout=${SYU_SSO_CONNECT_TIMEOUT:3s}
school-sso.read-timeout=${SYU_SSO_READ_TIMEOUT:5s}
school-sso.state-ttl=${SYU_SSO_STATE_TTL:10m}
school-sso.profile-ttl=${SYU_SSO_PROFILE_TTL:15m}
school-sso.key-cache-ttl=${SYU_SSO_KEY_CACHE_TTL:1h}
school-sso.clock-skew=${SYU_SSO_CLOCK_SKEW:30s}
school-sso.maximum-token-age=${SYU_SSO_MAX_TOKEN_AGE:10m}

# 대나무숲 익명 오픈채팅.
# 동시 요청 상한은 채팅 폭주가 스탬프·부스 지도·QR 의 스레드까지 가져가지 않게 막는다.
bamboo.max-concurrent-requests=${BAMBOO_MAX_CONCURRENT_REQUESTS:100}
bamboo.write-interval=${BAMBOO_WRITE_INTERVAL:5s}
bamboo.writes-per-minute=${BAMBOO_WRITES_PER_MINUTE:10}
bamboo.writes-per-hour=${BAMBOO_WRITES_PER_HOUR:200}
bamboo.reports-per-minute=${BAMBOO_REPORTS_PER_MINUTE:10}
bamboo.max-tracked-users=${BAMBOO_MAX_TRACKED_USERS:100000}
# 인증 캐시가 없으면 채팅 요청량에 SSO 가 먼저 포화된다.
bamboo.identity-ttl=${BAMBOO_IDENTITY_TTL:60s}
bamboo.identity-max-entries=${BAMBOO_IDENTITY_MAX_ENTRIES:20000}
# 본문 금칙어. 기본값은 비어 있다.
# 부분 문자열로 대조하므로 짧은 단어는 정상 문장을 막는다("시발" 은 "시발점" 을 함께 막는다).
# 그 자체로 다른 뜻이 되기 어려운 긴 표현만, 운영 전에 팀에서 직접 채운다.
