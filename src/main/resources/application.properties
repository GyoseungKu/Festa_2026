spring.application.name=Festa_2026
spring.config.import=optional:classpath:env.properties

server.port=${SERVER_PORT:8888}
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:400}
# A poll editor can submit 50 questions x 30 options plus media/checkbox fields.
# Tomcat's default 50 multipart parts rejects even small multi-question forms with 413.
server.tomcat.max-part-count=${SERVER_TOMCAT_MAX_PART_COUNT:12000}
server.tomcat.max-parameter-count=${SERVER_TOMCAT_MAX_PARAMETER_COUNT:12000}
server.tomcat.max-http-form-post-size=${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:16MB}
server.tomcat.max-part-header-size=${SERVER_TOMCAT_MAX_PART_HEADER_SIZE:4KB}
# Nginx overwrites X-Forwarded-* headers (see README); let Tomcat restore the public HTTPS scheme.
server.forward-headers-strategy=native

# Keep HTTP views, templates, and outbound mail consistently encoded on every host OS.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.mail.default-encoding=UTF-8

#spring.datasource.url=${DB_URL:jdbc:mysql://129.225.200.218:3306/Likelion_SYU_festa2026?allowPublicKeyRetrieval=true&connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/Likelion_SYU_festa2026?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=50
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=${DB_TIME_ZONE:Asia/Seoul}

r2.endpoint=${R2_ENDPOINT:https://2f59f81f48ee0c3340032aa91d361f58.r2.cloudflarestorage.com}
r2.region=${R2_REGION:auto}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET:likelion-main}
r2.base-url=${R2_BASE_URL:https://cdn.syu-likelion.org}
r2.performance-prefix=${R2_PERFORMANCE_PREFIX:festa2026_performance}
r2.lost-item-prefix=${R2_LOST_ITEM_PREFIX:festa2026_lost_items}
r2.booth-prefix=${R2_BOOTH_PREFIX:festa2026_booths}
r2.poll-prefix=${R2_POLL_PREFIX:festa2026_polls}
r2.image-max-size=${R2_IMAGE_MAX_SIZE:10MB}
r2.video-max-size=${R2_VIDEO_MAX_SIZE:200MB}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:650MB}
server.servlet.session.timeout=${SESSION_TIMEOUT:20m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

