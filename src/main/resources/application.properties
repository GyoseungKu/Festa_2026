spring.application.name=Festa_2026
spring.config.import=optional:classpath:env.properties

server.port=${SERVER_PORT:8888}

#상: 개발용 DB 원격 접속 경로
#하: 배포용 서버 로컬 DB 경로
spring.datasource.url=${DB_URL:jdbc:mariadb://129.225.200.218:3306/Likelion_SYU_festa2026}
#spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/Likelion_SYU_festa2026}

spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}

r2.endpoint=${R2_ENDPOINT:https://2f59f81f48ee0c3340032aa91d361f58.r2.cloudflarestorage.com}
r2.region=${R2_REGION:auto}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET:likelion-main}
r2.base-url=${R2_BASE_URL:https://cdn.syu-likelion.org}
r2.profile-prefix=${R2_PROFILE_PREFIX:profile}
r2.community-prefix=${R2_COMMUNITY_PREFIX:community}
r2.performance-prefix=${R2_PERFORMANCE_PREFIX:performance}
r2.image-max-size=${R2_IMAGE_MAX_SIZE:10MB}
r2.video-max-size=${R2_VIDEO_MAX_SIZE:200MB}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:650MB}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.from=no-reply@syu-likelion.org

spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

sso.base-url=${SSO_BASE_URL:https://sso.syu-likelion.org}
sso.client-id=${SSO_CLIENT_ID}
sso.client-secret=${SSO_CLIENT_SECRET}
sso.connect-timeout=${SSO_CONNECT_TIMEOUT:3s}
sso.read-timeout=${SSO_READ_TIMEOUT:5s}
sso.refresh-cookie-name=${SSO_REFRESH_COOKIE_NAME:refreshToken}
sso.service-scopes=${SSO_SERVICE_SCOPES:user.email.read user.profile.read}

auth.refresh-cookie-name=${FESTIVAL_REFRESH_COOKIE_NAME:festivalRefreshToken}
auth.refresh-cookie-secure=${FESTIVAL_REFRESH_COOKIE_SECURE:true}
auth.refresh-cookie-same-site=${FESTIVAL_REFRESH_COOKIE_SAME_SITE:Strict}
auth.refresh-cookie-max-age=${FESTIVAL_REFRESH_COOKIE_MAX_AGE:7d}

admin.access-cookie-name=${ADMIN_ACCESS_COOKIE_NAME:festivalAdminAccess}
admin.refresh-cookie-name=${ADMIN_REFRESH_COOKIE_NAME:festivalAdminRefresh}
admin.cookie-secure=${ADMIN_COOKIE_SECURE:true}
admin.cookie-same-site=${ADMIN_COOKIE_SAME_SITE:Strict}
admin.refresh-cookie-max-age=${ADMIN_REFRESH_COOKIE_MAX_AGE:7d}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}

# High-traffic API request logging: request threads never wait for log INSERTs.
api-request-log.enabled=${API_REQUEST_LOG_ENABLED:true}
api-request-log.queue-capacity=${API_REQUEST_LOG_QUEUE_CAPACITY:10000}
api-request-log.batch-size=${API_REQUEST_LOG_BATCH_SIZE:250}
api-request-log.flush-interval=${API_REQUEST_LOG_FLUSH_INTERVAL:250ms}
api-request-log.retention=${API_REQUEST_LOG_RETENTION:60d}
api-request-log.cleanup-interval=${API_REQUEST_LOG_CLEANUP_INTERVAL:5m}
api-request-log.cleanup-batch-size=${API_REQUEST_LOG_CLEANUP_BATCH_SIZE:5000}
api-request-log.cleanup-max-batches=${API_REQUEST_LOG_CLEANUP_MAX_BATCHES:4}
# All writes/admin/errors/slow calls are stored. Only successful API GETs are sampled.
api-request-log.successful-read-sample-rate=${API_REQUEST_LOG_SUCCESSFUL_READ_SAMPLE_RATE:0.25}
api-request-log.slow-request-threshold=${API_REQUEST_LOG_SLOW_REQUEST_THRESHOLD:1s}
# Enable only when the reverse proxy removes client-supplied Forwarded/X-Forwarded-For headers.
api-request-log.trust-forwarded-headers=${API_REQUEST_LOG_TRUST_FORWARDED_HEADERS:false}

# React page/action analytics. Events are queued and written with JDBC batches.
frontend-analytics.enabled=${FRONTEND_ANALYTICS_ENABLED:true}
frontend-analytics.queue-capacity=${FRONTEND_ANALYTICS_QUEUE_CAPACITY:20000}
frontend-analytics.batch-size=${FRONTEND_ANALYTICS_BATCH_SIZE:500}
frontend-analytics.flush-interval=${FRONTEND_ANALYTICS_FLUSH_INTERVAL:500ms}
frontend-analytics.retention=${FRONTEND_ANALYTICS_RETENTION:60d}
frontend-analytics.cleanup-interval=${FRONTEND_ANALYTICS_CLEANUP_INTERVAL:5m}
frontend-analytics.cleanup-batch-size=${FRONTEND_ANALYTICS_CLEANUP_BATCH_SIZE:5000}
frontend-analytics.cleanup-max-batches=${FRONTEND_ANALYTICS_CLEANUP_MAX_BATCHES:4}
frontend-analytics.maximum-past-age=${FRONTEND_ANALYTICS_MAXIMUM_PAST_AGE:24h}
frontend-analytics.maximum-future-skew=${FRONTEND_ANALYTICS_MAXIMUM_FUTURE_SKEW:5m}
frontend-analytics.maximum-duration=${FRONTEND_ANALYTICS_MAXIMUM_DURATION:12h}
frontend-analytics.max-events-per-minute=${FRONTEND_ANALYTICS_MAX_EVENTS_PER_MINUTE:120}
frontend-analytics.max-tracked-sessions=${FRONTEND_ANALYTICS_MAX_TRACKED_SESSIONS:100000}
frontend-analytics.session-tracking-ttl=${FRONTEND_ANALYTICS_SESSION_TRACKING_TTL:10m}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

qr.token-ttl=${QR_TOKEN_TTL:60s}
qr.cleanup-interval-ms=${QR_CLEANUP_INTERVAL_MS:60000}
