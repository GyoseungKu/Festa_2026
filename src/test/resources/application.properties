# Keep every test context isolated from developer and production infrastructure.
# This test resource intentionally does not import main/resources/env.properties.
spring.application.name=Festa_2026-test

spring.datasource.url=jdbc:h2:mem:festa-tests;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

sso.base-url=http://127.0.0.1:1
sso.client-id=test-client
sso.client-secret=test-secret
sso.connect-timeout=100ms
sso.read-timeout=100ms

r2.endpoint=http://127.0.0.1:1
r2.region=auto
r2.access-key=test-access-key
r2.secret-key=test-secret-key
r2.bucket=test-bucket
r2.base-url=https://cdn.test.invalid
r2.performance-prefix=test-performance
r2.lost-item-prefix=test-lost-items
r2.booth-prefix=test-booths

auth.refresh-cookie-secure=false
admin.cookie-secure=false
app.cors.allowed-origins=http://localhost:5173,https://festa.syu-likelion.org
api-request-log.enabled=false
frontend-analytics.enabled=false

management.server.port=0
management.endpoints.web.exposure.include=health
